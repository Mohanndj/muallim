<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار</title>
<meta name="theme-color" content="#0b5d43">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=2">
<style>
  body.student { padding-bottom: 30px; }
  .q-hero { background: radial-gradient(120% 140% at 100% 0%, #13895f 0%, #0b5d43 45%, #073826 100%); color: #fff; padding: 22px 18px 54px; text-align: center; }
  .q-hero small { color: #cfe6da; }
  .q-hero h1 { margin: 4px 0 0; font-size: 1.5rem; color: #fff; }
  .q-wrap { max-width: 680px; margin: -38px auto 0; padding: 0 16px; position: relative; }
  .q-prog { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; display: flex; align-items: center; gap: 10px; font-size: .88rem; color: var(--ink2); font-weight: 600; }
  .solve > li { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; margin: 12px 0; box-shadow: var(--shadow); }
  .solve > li.q-ok { border-color: var(--good); }
  .solve > li.q-no { border-color: var(--bad); }
  .qq { font-weight: 600; font-size: 1.05rem; margin: 2px 0 10px; display: inline; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .opt { text-align: start; border: 1.5px solid var(--line); background: var(--surface2); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 1rem; }
  .opt .l { width: 30px; height: 30px; border-radius: 9px; background: var(--surface); display: grid; place-items: center; font-family: var(--fh); font-weight: 700; flex: none; border: 1px solid var(--line); }
  .opt.on { border-color: var(--brand2); background: var(--brand-soft); font-weight: 700; }
  .opt.on .l { background: var(--brand2); color: #fff; border-color: var(--brand2); }
  .opt.right { border-color: var(--good); border-style: dashed; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); font-weight: 700; }
  .opt.wrong .l { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt:disabled { opacity: 1; cursor: default; }
  .verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; margin: 10px 0 0; }
  .score { text-align: center; padding: 22px 16px; }
  .ring { width: 150px; height: 150px; margin: 6px auto 4px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg) scaleY(-1); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .bgc { stroke: var(--surface2); }
  .ring .fgc { stroke: var(--brand2); stroke-linecap: round; transition: stroke-dashoffset 1s; }
  .ring b { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--fh); font-size: 2.6rem; line-height: 1.1; color: var(--brand); }
  .ring b small { font-size: .95rem; color: var(--muted); font-weight: 500; }
  .score h2 { font-size: 1.3rem; margin: 6px 0 2px; }
  .score p { color: var(--ink2); }
</style>
</head>
<body class="student">
<header class="q-hero"><small id="qSub">اختبار</small><h1 id="qTitle">يُحمَّل الاختبار…</h1></header>
<div class="q-wrap"><main id="main"></main></div>
<div id="toast" class="toast" hidden></div>
<script src="qcodec.js?v=2"></script>
<script>
'use strict';
// The students' page: the test comes inside the link itself (nothing is stored on any server).
// The student writes his name, answers, sees his mark, and sends the result to the teacher on
// WhatsApp with a code the teacher's app reads (and marks again by itself).
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ar = (s) => String(s ?? '').replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
const L = 'أبجدهو';
const icon = (d) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
const OK = icon('M5 12.5l4.5 4.5L19 7'), NO = icon('M6 6l12 12M18 6 6 18'), SEND = icon('M21 3 10 14M21 3l-7 18-4-7-7-4z');
let Z = null, answers = [], done = null;
const store = () => `muallim-q-${Z.i}`;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3000); }

async function start() {
  try { Z = await QCodec.unpack(location.hash.slice(1)); } catch { Z = null; }
  if (!Z || !Array.isArray(Z.q)) { $('qTitle').textContent = 'الرابط ناقص'; $('main').innerHTML = '<div class="card"><p class="warn">الرابط ناقص أو تالف. اطلب من معلمك إرساله مرة أخرى.</p></div>'; return; }
  document.title = Z.t; $('qTitle').textContent = Z.t; $('qSub').textContent = Z.s ? `مادة ${Z.s}` : 'اختبار';
  try { done = JSON.parse(localStorage.getItem(store())); } catch { done = null; }
  answers = done ? done.a : Z.q.map(() => null);
  draw();
}
// a word for the result, by how much was right
function cheer(p) {
  if (p >= 90) return ['ممتاز! أداء يستحق الفخر', 'بارك الله فيك، واصل على هذا المستوى.'];
  if (p >= 70) return ['أحسنت!', 'مستوى جيد جداً؛ راجع ما أخطأت فيه لتصل إلى القمة.'];
  if (p >= 50) return ['جيد، وتستطيع أفضل', 'راجع الأسئلة التي أخطأت فيها، فهي طريقك للتفوق.'];
  return ['لا بأس، المهم أن تتعلم', 'راجع الدرس مرة أخرى، وحاول من جديد.'];
}
function draw() {
  const name = done ? done.n : (localStorage.getItem('muallim-q-name') || '');
  const cls = done ? done.c : (localStorage.getItem('muallim-q-cls') || '');
  const score = done ? QCodec.score(Z.q, done.a) : 0;
  const p = Math.round((score / Z.q.length) * 100);
  const C = 2 * Math.PI * 64;
  const show = !!Z.a;
  const answered = answers.filter((a) => a !== null && a !== undefined).length;
  const [h, t] = cheer(p);
  $('main').innerHTML = `
    ${done ? `<div class="card score"><div class="ring"><svg viewBox="0 0 150 150"><circle class="bgc" cx="75" cy="75" r="64"/><circle class="fgc" cx="75" cy="75" r="64" style="stroke-dasharray:${C};stroke-dashoffset:${C * (1 - score / Z.q.length)}"/></svg><b>${ar(score)}<small>من ${ar(Z.q.length)}</small></b></div>
      <h2>${h}</h2><p>${t}</p>
      <button type="button" class="wa big" id="send">${SEND} أرسل نتيجتك للمعلم</button>
      <p class="hint">${Z.p ? 'يفتح واتساب برسالة إلى معلمك؛ اضغط إرسال ولا تعدّل شيئاً فيها.' : 'اختر معلمك في واتساب وأرسل الرسالة كما هي.'}</p></div>` : ''}
    <div class="card"><label>اسمك الثلاثي<input id="nm" value="${esc(name)}" ${done ? 'disabled' : ''} placeholder="الاسم الأول واسم الأب واسم العائلة"></label>
    <label>فصلك<input id="cl" value="${esc(cls)}" ${done ? 'disabled' : ''} placeholder="مثل: أول متوسط ١"></label></div>
    ${done ? '' : `<div class="q-prog"><span id="cnt">أجبت ${ar(answered)} من ${ar(Z.q.length)}</span><div class="bar"><i id="pbar" style="width:${(answered / Z.q.length) * 100}%"></i></div></div>`}
    <ol class="solve">${Z.q.map((q, i) => {
      const a = answers[i];
      const right = done ? a === q[3] : null;
      const choices = q[0] === 't' ? [[1, 'صح', OK], [0, 'خطأ', NO]] : q[2].map((o, k) => [k, o, L[k]]);
      return `<li class="${done ? (right ? 'q-ok' : 'q-no') : ''}"><p class="qq">${esc(ar(q[1]))}</p>
        <div class="opts">${choices.map(([v, t2, l]) => `<button type="button" class="opt${a === v ? (done ? (v === q[3] ? ' on' : ' wrong') : ' on') : ''}${done && show && v === q[3] && a !== v ? ' right' : ''}" data-i="${i}" data-v="${v}" ${done ? 'disabled' : ''}><span class="l">${l}</span><span>${esc(ar(t2))}</span></button>`).join('')}</div>
        ${done ? `<p class="verdict ${right ? 'good' : 'bad'}">${right ? `${OK} إجابتك صحيحة` : a === null || a === undefined ? `${NO} لم تُجب` : `${NO} إجابتك خاطئة`}</p>${show && q[4] ? `<p class="hint">${esc(ar(q[4]))}</p>` : ''}` : ''}</li>`;
    }).join('')}</ol>
    ${done ? '<button type="button" class="ghost big" id="again">حلّه مرة أخرى للتدرّب (تُحسب لمعلمك محاولتك الأولى)</button>' : '<button type="button" class="primary big" id="finish">أنهيت الاختبار</button>'}`;
}
document.addEventListener('click', (e) => {
  const o = e.target.closest('.opt');
  if (o && !done) {
    answers[Number(o.dataset.i)] = Number(o.dataset.v);
    for (const b of document.querySelectorAll(`.opt[data-i="${o.dataset.i}"]`)) b.classList.toggle('on', b === o);
    const n = answers.filter((a) => a !== null && a !== undefined).length;
    $('cnt').textContent = `أجبت ${ar(n)} من ${ar(Z.q.length)}`;
    $('pbar').style.width = `${(n / Z.q.length) * 100}%`;
    return;
  }
  const id = e.target.closest('button') && e.target.closest('button').id;
  if (id === 'finish') finish(e.target.closest('button'));
  if (id === 'send') send();
  if (id === 'again') { localStorage.removeItem(store()); done = null; answers = Z.q.map(() => null); draw(); window.scrollTo(0, 0); }
});
function finish(btn) {
  const n = $('nm').value.trim().replace(/\s+/g, ' ');
  const c = $('cl').value.trim();
  if (n.split(' ').length < 2) { toast('اكتب اسمك الثلاثي'); $('nm').focus(); return; }
  const left = answers.filter((a) => a === null).length;
  if (left && !btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = `بقي ${ar(left)} بلا إجابة. اضغط مرة أخرى للإنهاء`; return; }
  localStorage.setItem('muallim-q-name', n);
  localStorage.setItem('muallim-q-cls', c);
  done = { n, c, a: answers.slice(), at: Date.now() };
  localStorage.setItem(store(), JSON.stringify(done));
  draw();
  window.scrollTo(0, 0);
}
async function send() {
  const code = await QCodec.pack({ i: Z.i, n: done.n, c: done.c, a: done.a });
  const text = `نتيجة اختبار «${Z.t}»\nالطالب: ${done.n}\nالفصل: ${done.c || '—'}\nالدرجة: ${ar(QCodec.score(Z.q, done.a))} من ${ar(Z.q.length)}\n\nرمز التصحيح (لا تعدّله):\n⟦R:${code}⟧`;
  location.href = `https://wa.me/${Z.p || ''}?text=${encodeURIComponent(text)}`;
}
start();
</script>
</body>
</html>
