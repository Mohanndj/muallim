# فحص مؤقت: ملفات واجهة منصة مدرستي العامة (بلا دخول) لمعرفة صفحات الجدول وإعداد الدرس. يُحذف بعد الاستعمال.
name: Probe Madrasati
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          mkdir p && cd p
          curl -sSL -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/128 Mobile Safari/537.36" -o index.html -w "index %{http_code} %{url_effective}\n" https://schools.madrasati.sa/ || true
          head -c 3000 index.html; echo
          grep -oE '(src|href)="[^"]+\.(js|css)[^"]*"' index.html | head -40
          for u in $(grep -oE 'src="[^"]+\.js[^"]*"' index.html | sed 's/src="//;s/"$//' | head -30); do
            case "$u" in http*) url="$u";; /*) url="https://schools.madrasati.sa$u";; *) url="https://schools.madrasati.sa/$u";; esac
            f=$(basename "${u%%\?*}"); curl -sSL -o "$f" "$url" -w "$f %{http_code} %{size_download}\n" || true
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: p
