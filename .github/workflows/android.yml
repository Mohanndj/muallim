# يبني تطبيق «تحضير مدرستي» للأندرويد ويضعه في الإصدار «app» على GitHub ليُنزَّل من رابط ثابت.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # مفتاح التوقيع نفسه في كل بناء (محفوظ في ذاكرة GitHub لا في المستودع) حتى تُثبَّت النسخ الجديدة فوق القديمة
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle the filler
        run: mkdir -p android/app/src/main/assets && cp mdpage.js android/app/src/main/assets/mdpage.js
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk muallim-madrasati.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "تحضير مدرستي" --notes "تطبيق أندرويد يفتح منصة مدرستي ويعبّئ تحضير الدرس من «مساعد المعلم»."
          gh release upload app muallim-madrasati.apk --clobber
      # نسخة على موقع «مساعد المعلم» نفسه، لزر التثبيت في الإعدادات
      - name: Copy to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muallim-madrasati.apk
          git commit -m "Android app build ${{ github.run_number }}" && git pull --rebase origin main && git push origin HEAD:main || echo "no change"
